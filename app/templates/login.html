{% extends "base.html" %}

{% block title %}
    Iniciar sesión - AutoAudit
{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-7 col-lg-5">
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h1 class="h3 mb-2">
                        Acceso administrativo
                    </h1>

                    <p class="text-secondary mb-0">
                        Ingresa tus credenciales para configurar
                        el sistema de auditoría.
                    </p>
                </div>

                <form method="post">
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <div class="mb-3">
                        <label
                            for="usuario"
                            class="form-label"
                        >
                            Usuario
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="usuario"
                            name="usuario"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>

                    <div class="mb-4">
                        <label
                            for="clave"
                            class="form-label"
                        >
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="clave"
                            name="clave"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Iniciar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
